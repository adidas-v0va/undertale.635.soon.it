<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>proceed</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Courier";
        }

        .proceed-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.2rem;
            /* Зміщуємо текст трохи нижче середини */
            transform: translateY(35px); 
            transition: opacity 0.3s ease;
        }

        .proceed-link:hover {
            opacity: 0.6;
        }
    </style>
</head>
<body>
    <a href="/download" class="proceed-link">proceed</a>
</body>
</html>
