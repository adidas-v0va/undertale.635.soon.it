<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: monospace, sans-serif;
        }

        .secret-text {
            color: #000000;
            font-size: 1.2rem;
            /* Трохи нижче середини */
            transform: translateY(40px);
            cursor: default;
        }

        /* Робить текст чітко контрастним, коли користувач виділяє його курсором */
        .secret-text::selection {
            background-color: #ffffff;
            color: #000000;
        }
    </style>
</head>
<body>
    <div class="secret-text">What are you looking for here?</div>
</body>
</html>
